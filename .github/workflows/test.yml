name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: on ubuntu-26.04 (Cairo 1.18.4) the mesh style renders visibly
    # differently; see BACKLOG.md. 24.04 matches the references.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release mode: the golden test renders 153 backgrounds, and the
      # render-time checks are meant for optimized builds anyway.
      - name: Test, including the golden pixel test
        # Ubuntu's Cairo and Pixman anti-alias a few edge pixels differently
        # from the machine the references come from; see tests/golden.rs.
        env:
          PROSPEKT_GOLDEN_TOLERANCE: 2
        run: cargo test --release --all-targets

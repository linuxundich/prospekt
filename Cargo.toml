[package]
name = "prospekt"
description = "Deterministic procedural backgrounds and wallpapers drawn with Cairo"
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/linuxundich/prospekt"

[dependencies]
cairo-rs = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
serde_json = "1"
